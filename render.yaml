services:
  - type: web
    name: waingo-farm-pos
    env: docker
    plan: starter
    region: frankfurt
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: "Waingo Farm Agrovet"
      - key: APP_ENV
        value: production
      # Render's generateValue produces a random string, not the
      # base64:<32-byte-key> format Laravel's encrypter requires — every
      # request touching encryption (session handling included) crashed
      # with "Unsupported cipher or incorrect key length". Set manually in
      # the dashboard instead (Environment tab) with the output of
      # `php artisan key:generate --show`; sync: false keeps the Blueprint
      # from overwriting it on the next sync.
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://waingo-farm-pos.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
